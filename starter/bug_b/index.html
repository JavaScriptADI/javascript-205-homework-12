<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Bug hunt B - Product lookup</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main>
    <h1>Bug hunt B: product lookup</h1>
    <p class="muted">Enter a product number (1-194) to look it up.</p>
    <input id="id" type="number" placeholder="Product id">
    <button id="go">Look up</button>
    <div id="message"></div>
    <div id="product"></div>

    <h2>Featured picks</h2>
    <p id="timing" class="muted"></p>
    <ul id="featured"></ul>
  </main>
  <script src="app.js"></script>
</body>
</html>
